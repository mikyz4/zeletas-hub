<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis servicios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis servicios</h1><p><a class="btn btn-primary" href="../servicios/gestionar.html">Nuevo servicio</a></p><div id="list" class="grid"></div><p id="status"></p></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const q=await supabase.from('services').select('id,service_type,business_name,coverage_area,listing_id').eq('owner_id',s.user.id).order('created_at',{ascending:false}),box=document.getElementById('list'),status=document.getElementById('status');if(q.error){status.textContent='No se pudieron cargar tus servicios.'}else{for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><a class="btn btn-secondary">Ver anuncio</a>';e.querySelector('h3').textContent=x.service_type;e.querySelector('p').textContent=(x.business_name||'Profesional')+(x.coverage_area?' · '+x.coverage_area:'');e.querySelector('a').href=x.listing_id?'../marketplace/anuncio.html?id='+encodeURIComponent(x.listing_id):'../servicios/gestionar.html';box.appendChild(e)}}</script></body></html>
