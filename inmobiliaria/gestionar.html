<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión inmobiliaria - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1 id="heading">Publicar inmueble</h1><form id="f"><input id="propertyType" placeholder="Tipo de inmueble" required><select id="operation"><option value="sale">Venta</option><option value="rent">Alquiler</option><option value="transfer">Traspaso</option></select><input id="area" type="number" step=".01" placeholder="m²"><input id="bedrooms" type="number" min="0" placeholder="Habitaciones"><input id="bathrooms" type="number" min="0" placeholder="Baños"><input id="city" placeholder="Ciudad"><input id="province" placeholder="Provincia"><input id="postalCode" placeholder="Código postal"><input id="address" placeholder="Dirección"><input id="price" type="number" step=".01" placeholder="Precio"><textarea id="description" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button id="submit" class="btn btn-primary">Publicar inmueble</button></form><p id="s"></p></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const session=await requireAuth('../index.html');if(!session)throw new Error('auth');const id=new URLSearchParams(location.search).get('id');const s=document.getElementById('s');let listingId=null;
async function init(){if(!id)return;const q=await supabase.from('properties').select('id,listing_id,property_type,operation,area_m2,bedrooms,bathrooms,city,province,postal_code,address').eq('id',id).eq('owner_id',session.user.id).single();if(q.error){s.textContent='Inmueble no encontrado.';return}const d=q.data;listingId=d.listing_id;propertyType.value=d.property_type;operation.value=d.operation;area.value=d.area_m2??'';bedrooms.value=d.bedrooms??'';bathrooms.value=d.bathrooms??'';city.value=d.city??'';province.value=d.province??'';postalCode.value=d.postal_code??'';address.value=d.address??'';if(listingId){const l=await supabase.from('listings').select('price,description').eq('id',listingId).eq('owner_id',session.user.id).single();if(l.data){price.value=l.data.price??'';description.value=l.data.description??''}}heading.textContent='Editar inmueble';submit.textContent='Guardar cambios'}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!id){const l=await supabase.from('listings').insert({owner_id:session.user.id,category:'inmobiliaria',title:propertyType.value.trim()+' en '+city.value.trim(),description:description.value.trim(),price:price.value?Number(price.value):null,city:city.value.trim()}).select('id').single();if(l.error){s.textContent='No se pudo crear el anuncio.';return}listingId=l.data.id;const p=await supabase.from('properties').insert({owner_id:session.user.id,listing_id:listingId,operation:operation.value,property_type:propertyType.value.trim(),area_m2:area.value?Number(area.value):null,bedrooms:bedrooms.value?Number(bedrooms.value):null,bathrooms:bathrooms.value?Number(bathrooms.value):null,city:city.value.trim(),province:province.value.trim(),postal_code:postalCode.value.trim(),address:address.value.trim()});if(p.error){await supabase.from('listings').delete().eq('id',listingId);s.textContent='No se pudo guardar el inmueble.';return}}else{const l=await supabase.from('listings').update({title:propertyType.value.trim()+' en '+city.value.trim(),description:description.value.trim(),price:price.value?Number(price.value):null,city:city.value.trim()}).eq('id',listingId).eq('owner_id',session.user.id);if(l.error){s.textContent='No se pudo actualizar el anuncio.';return}const p=await supabase.from('properties').update({operation:operation.value,property_type:propertyType.value.trim(),area_m2:area.value?Number(area.value):null,bedrooms:bedrooms.value?Number(bedrooms.value):null,bathrooms:bathrooms.value?Number(bathrooms.value):null,city:city.value.trim(),province:province.value.trim(),postal_code:postalCode.value.trim(),address:address.value.trim()}).eq('id',id).eq('owner_id',session.user.id);if(p.error){s.textContent='No se pudo actualizar el inmueble.';return}}const file=image.files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file)}}location.href='../mi-inmobiliaria/'};
init();
</script></body></html>
