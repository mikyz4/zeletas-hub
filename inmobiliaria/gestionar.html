<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión inmobiliaria - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1 id="heading">Publicar inmueble</h1><form id="form"><input id="propertyType" placeholder="Tipo de inmueble" required><select id="operation"><option value="sale">Venta</option><option value="rent">Alquiler</option><option value="transfer">Traspaso</option></select><input id="area" type="number" min="0" step=".01" placeholder="m²"><input id="bedrooms" type="number" min="0" placeholder="Habitaciones"><input id="bathrooms" type="number" min="0" placeholder="Baños"><input id="address" placeholder="Dirección"><input id="postalCode" placeholder="Código postal"><input id="city" placeholder="Ciudad"><input id="province" placeholder="Provincia"><input id="energy" placeholder="Calificación energética"><input id="price" type="number" min="0" step=".01" placeholder="Precio"><textarea id="description" minlength="10" maxlength="5000" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button id="submit" class="btn btn-primary">Guardar</button></form><p id="status" role="status"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const id=new URLSearchParams(location.search).get('id'),g=k=>document.getElementById(k),form=g('form'),status=g('status'),submit=g('submit');let listingId=null;
async function load(){if(!id)return;const q=await supabase.from('properties').select('*').eq('id',id).eq('owner_id',s.user.id).single();if(q.error){status.textContent='Inmueble no encontrado.';form.hidden=true;return}const v=q.data;document.getElementById('heading').textContent='Editar inmueble';submit.textContent='Guardar cambios';for(const [k,val] of [['propertyType',v.property_type],['operation',v.operation],['area',v.area_m2],['bedrooms',v.bedrooms],['bathrooms',v.bathrooms],['address',v.address],['postalCode',v.postal_code],['city',v.city],['province',v.province],['energy',v.energy_rating]])g(k).value=val??'';listingId=v.listing_id;if(listingId){const l=await supabase.from('listings').select('description,price').eq('id',listingId).single();if(l.data){g('description').value=l.data.description||'';g('price').value=l.data.price??''}}}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;const listing={owner_id:s.user.id,category:'inmobiliaria',title:g('propertyType').value.trim()+' en '+g('city').value.trim(),description:g('description').value.trim(),price:g('price').value?Number(g('price').value):null,city:g('city').value.trim()};const data={owner_id:s.user.id,listing_id:listingId,operation:g('operation').value,property_type:g('propertyType').value.trim(),area_m2:g('area').value?Number(g('area').value):null,bedrooms:g('bedrooms').value?Number(g('bedrooms').value):null,bathrooms:g('bathrooms').value?Number(g('bathrooms').value):null,address:g('address').value.trim()||null,postal_code:g('postalCode').value.trim()||null,city:g('city').value.trim()||null,province:g('province').value.trim()||null,energy_rating:g('energy').value.trim()||null};if(id){await supabase.from('listings').update(listing).eq('id',listingId).eq('owner_id',s.user.id);const q=await supabase.from('properties').update(data).eq('id',id).eq('owner_id',s.user.id);if(q.error){status.textContent='No se pudieron guardar los cambios.';submit.disabled=false;return}}else{const l=await supabase.from('listings').insert(listing).select('id').single();if(l.error){status.textContent='No se pudo crear el anuncio.';submit.disabled=false;return}listingId=l.data.id;const q=await supabase.from('properties').insert({...data,listing_id:listingId});if(q.error){await supabase.from('listings').delete().eq('id',listingId);status.textContent='No se pudo guardar el inmueble.';submit.disabled=false;return}}const file=g('image').files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);if(!up.error)await supabase.from('listing_media').insert({listing_id:listingId,storage_path:u.data.path})}}location.href='../marketplace/anuncio.html?id='+listingId});load();</script></body></html>
