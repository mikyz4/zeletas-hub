<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión inmobiliaria - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Gestionar inmueble</h1><form id="f"><input id="propertyType" placeholder="Tipo de inmueble" required><select id="operation"><option value="sale">Venta</option><option value="rent">Alquiler</option></select><input id="area" type="number" step=".01" placeholder="m²"><input id="bedrooms" type="number" min="0" placeholder="Habitaciones"><input id="bathrooms" type="number" min="0" placeholder="Baños"><input id="city" placeholder="Ciudad"><input id="price" type="number" step=".01" placeholder="Precio"><textarea id="description" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Publicar inmueble</button></form><p id="s"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');f.onsubmit=async e=>{e.preventDefault();const l=await supabase.from('listings').insert({owner_id:s.user.id,category:'inmobiliaria',title:propertyType.value+' en '+city.value,description:description.value,price:price.value?Number(price.value):null,city:city.value}).select().single();if(l.error)return document.getElementById('s').textContent='No se pudo crear el anuncio.';const p=await supabase.from('properties').insert({owner_id:s.user.id,listing_id:l.data.id,operation:operation.value,property_type:propertyType.value,area_m2:area.value?Number(area.value):null,bedrooms:bedrooms.value?Number(bedrooms.value):null,bathrooms:bathrooms.value?Number(bathrooms.value):null,city:city.value}).select().single();if(p.error){await supabase.from('listings').delete().eq('id',l.data.id);return document.getElementById('s').textContent='No se pudo guardar el inmueble.'}const file=image.files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);await supabase.from('listing_media').insert({listing_id:l.data.id,storage_path:u.data.path})}}location.href='../marketplace/anuncio.html?id='+l.data.id}</script></body></html>
