<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anuncio - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><article id="card" class="card" style="max-width:850px;margin:auto"><p>Cargando…</p></article></main><script type="module">
import {supabase} from '../assets/js/supabase.js';
const id=new URLSearchParams(location.search).get('id'),card=document.getElementById('card');if(!id){card.textContent='Anuncio no encontrado.'}else{const {data:x,error}=await supabase.from('listings').select('id,owner_id,title,description,price,city,category').eq('id',id).single();if(error||!x){card.textContent='Anuncio no encontrado.'}else{card.innerHTML='<h1></h1><p></p><strong></strong><p></p><div id="actions"></div>';card.children[0].textContent=x.title;card.children[1].textContent=x.description;card.children[2].textContent=x.price==null?'Precio a consultar':Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'});card.children[3].textContent=x.city?'Ubicación: '+x.city:'';const actions=document.getElementById('actions');const {data:{session}}=await supabase.auth.getSession();if(session&&session.user.id!==x.owner_id){const report=document.createElement('button');report.className='btn btn-secondary';report.textContent='Reportar anuncio';report.onclick=async()=>{const r=await supabase.functions.invoke('report-content',{body:{targetType:'listing',targetId:x.id,reason:'Contenido inapropiado o sospechoso'}});alert(r.error?'No se pudo enviar el reporte.':'Reporte enviado para revisión.');};actions.appendChild(report);const b=document.createElement('button');b.className='btn btn-primary';b.textContent='Contactar con el vendedor';b.onclick=async()=>{b.disabled=true;const c=await supabase.functions.invoke('start-conversation',{body:{listingId:x.id}});if(c.error){alert('No se pudo iniciar la conversación.');b.disabled=false;return}location.href='../chat/?conversation='+c.data.id};actions.appendChild(b)}}}
</script></body></html>
