<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anuncio - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><article id="card" class="card" style="max-width:900px;margin:auto"><p>Cargando…</p></article></main><script type="module">
import {supabase} from '../assets/js/supabase.js';
const id=new URLSearchParams(location.search).get('id');const card=document.getElementById('card');
if(!id){card.textContent='Anuncio no encontrado.'}else{
 const {data:x,error}=await supabase.from('listings').select('id,title,description,price,city,category').eq('id',id).single();
 if(error||!x){card.textContent='Anuncio no encontrado.'}else{
   card.innerHTML='<h1></h1><p></p><strong></strong><p></p><div id="media" class="grid"></div><div id="actions"></div>';
   card.querySelector('h1').textContent=x.title;card.querySelector('p').textContent=x.description;card.querySelector('strong').textContent=x.price==null?'Precio a consultar':Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'});card.querySelector('p:nth-of-type(2)').textContent=x.city?'Ubicación: '+x.city:'';
   const media=document.getElementById('media');const mq=await supabase.from('listing_media').select('storage_path,alt_text,sort_order').eq('listing_id',x.id).order('sort_order');
   for(const m of mq.data||[]){const e=document.createElement('img');e.loading='lazy';e.alt=m.alt_text||x.title;e.style.maxWidth='100%';e.style.borderRadius='12px';e.src=supabase.storage.from('media').getPublicUrl(m.storage_path).data.publicUrl;media.appendChild(e)}
   const {data:{session}}=await supabase.auth.getSession();const actions=document.getElementById('actions');
   if(session){const contact=document.createElement('button');contact.className='btn btn-primary';contact.textContent='Contactar con el vendedor';contact.onclick=async()=>{contact.disabled=true;const r=await supabase.functions.invoke('start-conversation',{body:{listingId:x.id}});if(r.error){alert('No se pudo iniciar la conversación.');contact.disabled=false;return}location.href='../chat/?conversation='+r.data.conversationId};actions.appendChild(contact);const report=document.createElement('button');report.className='btn btn-secondary';report.textContent='Reportar anuncio';report.onclick=async()=>{const reason=prompt('Motivo del reporte');if(!reason?.trim())return;const r=await supabase.functions.invoke('report-content',{body:{targetType:'listing',targetId:x.id,reason:reason.trim()}});alert(r.error?'No se pudo enviar el reporte.':'Reporte enviado. Gracias.');};actions.appendChild(report)}
 }
}
</script></body></html>
