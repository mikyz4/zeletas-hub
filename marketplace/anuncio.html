<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anuncio - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><article id="card" class="card" style="max-width:850px;margin:auto"><p>Cargando…</p></article></main><script type="module">
import {supabase} from '../assets/js/supabase.js';
const id=new URLSearchParams(location.search).get('id'),card=document.getElementById('card');
if(!id){card.textContent='Anuncio no encontrado.'}else{
 const q=await supabase.from('listings').select('id,owner_id,title,description,price,city,category,status').eq('id',id).single();
 if(q.error||!q.data||q.data.status!=='published'&&!q.data.owner_id){card.textContent='Anuncio no encontrado.'}else{
  const x=q.data;card.replaceChildren();const h=document.createElement('h1');h.textContent=x.title;card.appendChild(h);const d=document.createElement('p');d.textContent=x.description;card.appendChild(d);const price=document.createElement('strong');price.textContent=x.price==null?'Precio a consultar':Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'});card.appendChild(price);const place=document.createElement('p');place.textContent=x.city?'Ubicación: '+x.city:'';card.appendChild(place);
  const media=await supabase.from('listing_media').select('storage_path,alt_text,sort_order').eq('listing_id',x.id).order('sort_order');
  if(media.data?.length){const gallery=document.createElement('div');gallery.className='grid';for(const m of media.data){const im=document.createElement('img');im.loading='lazy';im.alt=m.alt_text||x.title;im.src=supabase.storage.from('media').getPublicUrl(m.storage_path).data.publicUrl;im.style.maxWidth='100%';gallery.appendChild(im)}card.appendChild(gallery)}
  const actions=document.createElement('div');actions.className='hero-actions';const {data:{session}}=await supabase.auth.getSession();
  if(session&&session.user.id!==x.owner_id){const b=document.createElement('button');b.className='btn btn-primary';b.textContent='Contactar con el vendedor';b.onclick=async()=>{b.disabled=true;const r=await supabase.functions.invoke('start-conversation',{body:{listingId:x.id}});if(r.error){b.disabled=false;alert('No se pudo iniciar la conversación.');return}location.href='../chat/?conversation='+r.data.id};actions.appendChild(b)}
  if(session){const report=document.createElement('a');report.className='btn btn-secondary';report.textContent='Reportar anuncio';report.href='../reportar/?type=listing&id='+encodeURIComponent(x.id);actions.appendChild(report)}
  card.appendChild(actions);
 }
}
</script></body></html>
