<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace General - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1 class="section-title">Marketplace General</h1><div class="hero-actions"><a class="btn btn-primary" href="publicar.html">+ Publicar anuncio</a><a class="btn btn-secondary" href="index.html">Volver</a></div><section id="grid" class="grid"></section><p id="status"></p></main><script type="module">
import {supabase} from '../assets/js/supabase.js';const grid=document.getElementById('grid'),status=document.getElementById('status');const {data,error}=await supabase.from('listings').select('id,title,description,price,city,category').eq('status','published').eq('category','general').order('created_at',{ascending:false});if(error){status.textContent='No se pudieron cargar los anuncios.'}else if(!data?.length){status.textContent='Todavía no hay anuncios publicados.'}else{for(const x of data){const el=document.createElement('article');el.className='card';el.innerHTML='<h3></h3><p></p><strong></strong><br><a class="btn btn-primary">Ver anuncio</a>';el.querySelector('h3').textContent=x.title;el.querySelector('p').textContent=x.description;el.querySelector('strong').textContent=x.price==null?'Precio a consultar':Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'});el.querySelector('a').href='anuncio.html?id='+encodeURIComponent(x.id);grid.appendChild(el);}}
</script></body></html>
