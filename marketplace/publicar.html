<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar anuncio - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card" style="max-width:760px;margin:auto"><h1 id="heading">Publicar anuncio</h1><form id="form"><label for="category">Categoría</label><select id="category"><option value="general">General</option><option value="vehiculos">Vehículos</option><option value="inmobiliaria">Inmobiliaria</option><option value="servicios">Servicios</option></select><label for="title">Título</label><input id="title" maxlength="120" required><label for="description">Descripción</label><textarea id="description" minlength="10" maxlength="5000" required></textarea><label for="price">Precio (€)</label><input id="price" type="number" min="0" step="0.01"><label for="city">Ciudad</label><input id="city" maxlength="120"><button class="btn btn-primary" type="submit" id="submit">Publicar</button><p id="status" role="status"></p></form></div></main><script type="module">
import {requireAuth} from '../assets/js/auth.js';import {supabase} from '../assets/js/supabase.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const id=new URLSearchParams(location.search).get('id');const out=document.getElementById('status');
async function init(){if(!id)return;const q=await supabase.from('listings').select('id,category,title,description,price,city,status').eq('id',id).eq('owner_id',s.user.id).single();if(q.error){out.textContent='Anuncio no encontrado.';return}const x=q.data;category.value=x.category;title.value=x.title;description.value=x.description;price.value=x.price??'';city.value=x.city??'';heading.textContent='Editar anuncio';submit.textContent='Guardar cambios'}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();out.textContent='Guardando…';const data={category:category.value,title:title.value.trim(),description:description.value.trim(),price:price.value===''?null:Number(price.value),city:city.value.trim()||null};let r;if(id){r=await supabase.from('listings').update(data).eq('id',id).eq('owner_id',s.user.id)}else{r=await supabase.from('listings').insert({owner_id:s.user.id,...data}).select('id').single()}if(r.error){console.error(r.error);out.textContent='No se pudo guardar el anuncio.';out.style.color='red';return}out.textContent='Anuncio guardado y enviado a revisión.';out.style.color='green';setTimeout(()=>location.href='../mis-anuncios/',700)});init();
</script></body></html>
