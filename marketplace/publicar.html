<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar anuncio - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card" style="max-width:760px;margin:auto"><h1>Publicar anuncio</h1><form id="form"><label>Categoría<select id="category"><option value="general">General</option><option value="vehiculos">Vehículos</option><option value="inmobiliaria">Inmobiliaria</option><option value="servicios">Servicios</option></select></label><label>Título<input id="title" maxlength="120" required></label><label>Descripción<textarea id="description" minlength="10" maxlength="5000" required></textarea></label><label>Precio (€)<input id="price" type="number" min="0" step="0.01"></label><label>Ciudad<input id="city" maxlength="120"></label><button class="btn btn-primary" type="submit">Publicar</button><p id="status"></p></form></div></main><script type="module">
import {requireAuth} from '../assets/js/auth.js';import {supabase} from '../assets/js/supabase.js';
const s=await requireAuth('../index.html');if(!s)throw new Error('auth');
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Publicando…';const p=document.getElementById('price').value;const {data,error}=await supabase.from('listings').insert({owner_id:s.user.id,category:category.value,title:title.value.trim(),description:description.value.trim(),price:p===''?null:Number(p),city:city.value.trim()||null}).select('id').single();if(error){console.error(error);status.textContent='No se pudo publicar.';status.style.color='red';return;}status.textContent='Publicado correctamente.';status.style.color='green';setTimeout(()=>location.href='anuncio.html?id='+data.id,600);});
</script></body></html>
