<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar anuncio - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Publicar anuncio</h1><form id="form"><label>Categoría<select id="category"><option value="general">General</option><option value="vehiculos">Vehículos</option><option value="inmobiliaria">Inmobiliaria</option><option value="servicios">Servicios</option></select></label><label>Título<input id="title" maxlength="120" required></label><label>Descripción<textarea id="description" minlength="10" maxlength="5000" required></textarea></label><label>Precio (€)<input id="price" type="number" min="0" step=".01"></label><label>Ciudad<input id="city" maxlength="120"></label><button id="submit" class="btn btn-primary" type="submit">Publicar</button><p id="status" role="status"></p></form></div></main><script type="module">import {requireAuth} from '../assets/js/auth.js';import {supabase} from '../assets/js/supabase.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const form=document.getElementById('form'),category=document.getElementById('category'),title=document.getElementById('title'),description=document.getElementById('description'),price=document.getElementById('price'),city=document.getElementById('city'),submit=document.getElementById('submit'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status.textContent='Enviando a moderación…';const amount=price.value.trim();const {data,error}=await supabase.from('listings').insert({owner_id:s.user.id,category:category.value,title:title.value.trim(),description:description.value.trim(),price:amount===''?null:Number(amount),city:city.value.trim()||null}).select('id').single();if(error){console.error(error);status.textContent='No se pudo publicar.';submit.disabled=false;return}location.href='anuncio.html?id='+encodeURIComponent(data.id)});</script></body></html>
