<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Vehículos - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1 class="section-title">Vehículos</h1><p class="section-subtitle">Vehículos publicados y pendientes de revisión controlados por ZELETAS.</p><div class="hero-actions"><a class="btn btn-primary" href="../vehiculos/gestionar.html">Publicar vehículo</a><a class="btn btn-secondary" href="index.html">Volver</a></div><div class="card"><select id="filter"><option value="">Todos</option><option value="nuevo">Nuevo</option><option value="seminuevo">Seminuevo</option><option value="segunda-mano">Segunda mano</option><option value="importacion">Importación</option><option value="gestion">Gestión / Intermediación</option></select></div><section id="grid" class="grid"></section><p id="status"></p></main><script type="module">import {supabase} from "../assets/js/supabase.js";const grid=document.getElementById("grid"),status=document.getElementById("status"),filter=document.getElementById("filter");let all=[];function render(){const f=filter.value;grid.replaceChildren();const rows=all.filter(x=>!f||x.metadata?.subcategory===f);status.textContent=rows.length?"":"No hay vehículos publicados en esta categoría.";for(const x of rows){const e=document.createElement("article");e.className="card";e.innerHTML="<h3></h3><p></p><strong></strong><small></small><br><a class="btn btn-primary">Ver anuncio</a>";const v=x.vehicles?.[0];e.querySelector("h3").textContent=x.title;e.querySelector("p").textContent=(v?[v.make,v.model,v.year,v.mileage?(v.mileage+" km"):null,v.fuel,v.transmission].filter(Boolean).join(" · "):x.description);e.querySelector("strong").textContent=x.price==null?"Consultar":Number(x.price).toLocaleString("es-ES",{style:"currency",currency:"EUR"});e.querySelector("small").textContent=x.city||"";e.querySelector("a").href="anuncio.html?id="+encodeURIComponent(x.id);grid.appendChild(e)}}const q=await supabase.from("listings").select("id,title,description,price,city,metadata,vehicles(make,model,year,mileage,fuel,transmission)").eq("status","published").eq("category","vehiculos").order("created_at",{ascending:false});if(q.error)status.textContent="No se pudo cargar el catálogo.";else{all=q.data||[];render()}filter.addEventListener("change",render);</script></body></html>
