<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de vehículo - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1 id="heading">Publicar vehículo</h1><form id="form"><select id="subcategory"><option value="nuevo">Nuevo</option><option value="seminuevo">Seminuevo</option><option value="segunda-mano">Segunda mano</option><option value="importacion">Importación</option><option value="gestion">Gestión / Intermediación</option></select><input id="make" placeholder="Marca" required><input id="model" placeholder="Modelo" required><input id="year" type="number" min="1886" placeholder="Año"><input id="mileage" type="number" min="0" placeholder="Kilómetros"><input id="fuel" placeholder="Combustible"><input id="transmission" placeholder="Cambio"><input id="power" type="number" min="0" placeholder="Potencia kW"><input id="vin" maxlength="17" placeholder="VIN"><input id="color" placeholder="Color"><input id="doors" type="number" min="1" max="8" placeholder="Puertas"><input id="bodyType" placeholder="Carrocería"><input id="condition" placeholder="Estado"><input id="price" type="number" min="0" step=".01" placeholder="Precio"><textarea id="description" minlength="10" maxlength="5000" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button id="submit" class="btn btn-primary">Guardar</button></form><p id="status" role="status"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const id=new URLSearchParams(location.search).get('id');const form=document.getElementById('form'),heading=document.getElementById('heading'),submit=document.getElementById('submit'),status=document.getElementById('status');const el=id2=>document.getElementById(id2);
async function load(){if(!id)return;const q=await supabase.from('vehicles').select('*').eq('id',id).eq('owner_id',s.user.id).single();if(q.error){status.textContent='Vehículo no encontrado.';form.hidden=true;return}heading.textContent='Editar vehículo';submit.textContent='Guardar cambios';const v=q.data;const listingMeta=v.listing_id?(await supabase.from('listings').select('metadata').eq('id',v.listing_id).single()).data?.metadata:null;el('subcategory').value=listingMeta?.subcategory||'segunda-mano';el('make').value=v.make||'';el('model').value=v.model||'';el('year').value=v.year||'';el('mileage').value=v.mileage??'';el('fuel').value=v.fuel||'';el('transmission').value=v.transmission||'';el('power').value=v.power_kw??'';el('vin').value=v.vin||'';el('color').value=v.color||'';el('doors').value=v.doors??'';el('bodyType').value=v.body_type||'';el('condition').value=v.condition||'';if(v.listing_id){const l=await supabase.from('listings').select('title,description,price').eq('id',v.listing_id).single();if(l.data){el('description').value=l.data.description||'';el('price').value=l.data.price??''}}}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;const data={owner_id:s.user.id,make:el('make').value.trim(),model:el('model').value.trim(),year:el('year').value?Number(el('year').value):null,mileage:el('mileage').value?Number(el('mileage').value):null,fuel:el('fuel').value.trim()||null,transmission:el('transmission').value.trim()||null,power_kw:el('power').value?Number(el('power').value):null,vin:el('vin').value.trim()||null,color:el('color').value.trim()||null,doors:el('doors').value?Number(el('doors').value):null,body_type:el('bodyType').value.trim()||null,condition:el('condition').value.trim()||null};const listing={owner_id:s.user.id,category:'vehiculos',metadata:{subcategory:g('subcategory').value},title:data.make+' '+data.model,description:el('description').value.trim(),price:el('price').value?Number(el('price').value):null};let listingId=id?((await supabase.from('vehicles').select('listing_id').eq('id',id).single()).data?.listing_id):null;if(id){if(listingId)await supabase.from('listings').update(listing).eq('id',listingId).eq('owner_id',s.user.id);const q=await supabase.from('vehicles').update({...data,listing_id:listingId}).eq('id',id).eq('owner_id',s.user.id);if(q.error){status.textContent='No se pudieron guardar los cambios.';submit.disabled=false;return}}else{const l=await supabase.from('listings').insert(listing).select('id').single();if(l.error){status.textContent='No se pudo crear el anuncio.';submit.disabled=false;return}listingId=l.data.id;const q=await supabase.from('vehicles').insert({...data,listing_id:listingId});if(q.error){await supabase.from('listings').delete().eq('id',listingId);status.textContent='No se pudo guardar el vehículo.';submit.disabled=false;return}}const file=el('image').files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);if(!up.error)await supabase.from('listing_media').insert({listing_id:listingId,storage_path:u.data.path})}}location.href='../marketplace/anuncio.html?id='+listingId});load();</script></body></html>
