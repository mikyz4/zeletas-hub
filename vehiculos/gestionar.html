<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de vehículos - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Gestionar vehículo</h1><form id="f"><input id="make" placeholder="Marca" required><input id="model" placeholder="Modelo" required><input id="year" type="number" placeholder="Año"><input id="mileage" type="number" placeholder="Kilómetros"><input id="fuel" placeholder="Combustible"><input id="transmission" placeholder="Cambio"><input id="price" type="number" step=".01" placeholder="Precio"><textarea id="description" placeholder="Descripción" required></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Publicar vehículo</button></form><p id="s"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');f.onsubmit=async e=>{e.preventDefault();const l=await supabase.from('listings').insert({owner_id:s.user.id,category:'vehiculos',title:make.value+' '+model.value,description:description.value,price:price.value?Number(price.value):null}).select().single();if(l.error){document.getElementById('s').textContent='No se pudo crear el anuncio.';return}const v=await supabase.from('vehicles').insert({owner_id:s.user.id,listing_id:l.data.id,make:make.value,model:model.value,year:year.value?Number(year.value):null,mileage:mileage.value?Number(mileage.value):null,fuel:fuel.value,transmission:transmission.value}).select().single();if(v.error){await supabase.from('listings').delete().eq('id',l.data.id);document.getElementById('s').textContent='No se pudo guardar el vehículo.';return}const file=image.files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);await supabase.from('listing_media').insert({listing_id:l.data.id,storage_path:u.data.path})}}location.href='../marketplace/anuncio.html?id='+l.data.id}</script></body></html>
