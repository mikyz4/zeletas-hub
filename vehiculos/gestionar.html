<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de vehículos - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1 id="heading">Publicar vehículo</h1><form id="f"><input id="make" placeholder="Marca" required><input id="model" placeholder="Modelo" required><input id="year" type="number" placeholder="Año"><input id="mileage" type="number" placeholder="Kilómetros"><input id="fuel" placeholder="Combustible"><input id="transmission" placeholder="Cambio"><input id="price" type="number" step=".01" placeholder="Precio"><textarea id="description" placeholder="Descripción" required></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button id="submit" class="btn btn-primary">Publicar vehículo</button></form><p id="s"></p></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const session=await requireAuth('../index.html');if(!session)throw new Error('auth');const id=new URLSearchParams(location.search).get('id');const s=document.getElementById('s');async function init(){if(!id)return;const q=await supabase.from('vehicles').select('id,listing_id,make,model,year,mileage,fuel,transmission').eq('id',id).eq('owner_id',session.user.id).single();if(q.error){s.textContent='Vehículo no encontrado.';return}Object.entries(q.data).forEach(([k,v])=>{const el=document.getElementById(k);if(el&&v!=null)el.value=v});if(q.data.listing_id){const l=await supabase.from('listings').select('price,description').eq('id',q.data.listing_id).eq('owner_id',session.user.id).single();if(l.data){price.value=l.data.price??'';description.value=l.data.description??''}}heading.textContent='Editar vehículo';submit.textContent='Guardar cambios'}document.getElementById('f').onsubmit=async e=>{e.preventDefault();let listingId=id;let l;if(id){const v=await supabase.from('vehicles').select('listing_id').eq('id',id).eq('owner_id',session.user.id).single();listingId=v.data?.listing_id}else{const r=await supabase.from('listings').insert({owner_id:session.user.id,category:'vehiculos',title:make.value.trim()+' '+model.value.trim(),description:description.value.trim(),price:price.value?Number(price.value):null}).select('id').single();if(r.error){s.textContent='No se pudo crear el anuncio.';return}listingId=r.data.id}if(id){l=await supabase.from('listings').update({title:make.value.trim()+' '+model.value.trim(),description:description.value.trim(),price:price.value?Number(price.value):null}).eq('id',listingId).eq('owner_id',session.user.id)}const v= id ? await supabase.from('vehicles').update({make:make.value.trim(),model:model.value.trim(),year:year.value?Number(year.value):null,mileage:mileage.value?Number(mileage.value):null,fuel:fuel.value.trim(),transmission:transmission.value.trim()}).eq('id',id).eq('owner_id',session.user.id) : await supabase.from('vehicles').insert({owner_id:session.user.id,listing_id:listingId,make:make.value.trim(),model:model.value.trim(),year:year.value?Number(year.value):null,mileage:mileage.value?Number(mileage.value):null,fuel:fuel.value.trim(),transmission:transmission.value.trim()});if(v.error){if(!id)await supabase.from('listings').delete().eq('id',listingId);s.textContent='No se pudo guardar el vehículo.';return}const file=image.files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);if(!up.error)await supabase.from('listing_media').insert({listing_id:listingId,storage_path:u.data.path})}}location.href='../mis-vehiculos/'};init();
</script></body></html>
