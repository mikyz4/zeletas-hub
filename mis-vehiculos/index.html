<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis vehículos - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis vehículos</h1><p id="status">Cargando…</p><div id="list" class="grid"></div><a class="btn btn-primary" href="../vehiculos/gestionar.html">+ Publicar vehículo</a></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const box=document.getElementById('list'),status=document.getElementById('status');async function load(){const q=await supabase.from('vehicles').select('id,make,model,year,mileage,listing_id').eq('owner_id',s.user.id).order('created_at',{ascending:false});if(q.error){status.textContent='No se pudieron cargar tus vehículos.';return}status.textContent=q.data?.length?'':'No tienes vehículos todavía.';box.replaceChildren();for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><a class="btn btn-secondary">Ver anuncio</a> <button class="btn btn-secondary">Eliminar</button>';e.querySelector('h3').textContent=x.make+' '+x.model;e.querySelector('p').textContent=(x.year||'')+' · '+(x.mileage??'—')+' km';const a=e.querySelector('a');if(x.listing_id)a.href='../marketplace/anuncio.html?id='+x.listing_id;else a.remove();e.querySelector('button').onclick=async()=>{if(!confirm('Eliminar este vehículo?'))return;const r=await supabase.from('vehicles').delete().eq('id',x.id);if(r.error)alert('No se pudo eliminar.');else{if(x.listing_id)await supabase.from('listings').delete().eq('id',x.listing_id);load()}};box.appendChild(e)}}load();</script></body></html>
