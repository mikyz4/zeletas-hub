<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis vehículos - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis vehículos</h1><p id="status">Cargando…</p><section id="list" class="grid"></section><a class="btn btn-primary" href="../vehiculos/gestionar.html">Nuevo vehículo</a></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const q=await supabase.from('vehicles').select('id,make,model,year,mileage,listing_id').eq('owner_id',s.user.id).order('created_at',{ascending:false});const box=document.getElementById('list');for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><a class="btn btn-secondary">Editar</a> <button class="btn btn-secondary">Eliminar</button>';e.querySelector('h3').textContent=x.make+' '+x.model;e.querySelector('p').textContent=[x.year,x.mileage!=null?x.mileage.toLocaleString('es-ES')+' km':''].filter(Boolean).join(' · ');e.querySelector('a').href='../vehiculos/gestionar.html?id='+x.id;e.querySelector('button').onclick=async()=>{if(!confirm('Eliminar este vehículo?'))return;const r=await supabase.from('vehicles').delete().eq('id',x.id);if(r.error)return alert('No se pudo eliminar.');location.reload()};box.appendChild(e)}document.getElementById('status').textContent=q.error?'No se pudieron cargar los vehículos.':(q.data?.length?'':'Todavía no tienes vehículos.');</script></body></html>
