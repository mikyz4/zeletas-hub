<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis vehículos - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis vehículos</h1><p><a class="btn btn-primary" href="../vehiculos/gestionar.html">Nuevo vehículo</a></p><div id="list" class="grid"></div><p id="status"></p></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const q=await supabase.from('vehicles').select('id,make,model,year,mileage,listing_id').eq('owner_id',s.user.id).order('created_at',{ascending:false}),box=document.getElementById('list'),status=document.getElementById('status');if(q.error){status.textContent='No se pudieron cargar tus vehículos.'}else{for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><a class="btn btn-secondary">Ver anuncio</a>';e.querySelector('h3').textContent=x.make+' '+x.model;e.querySelector('p').textContent=(x.year||'')+' · '+(x.mileage==null?'Kilometraje no indicado':x.mileage.toLocaleString('es-ES')+' km');e.querySelector('a').href=x.listing_id?'../marketplace/anuncio.html?id='+encodeURIComponent(x.listing_id):'../vehiculos/gestionar.html';box.appendChild(e)}}</script></body></html>
