<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación de seguridad - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section" style="max-width:620px;margin:auto"><div class="card"><h1>Verificación de seguridad</h1><p id="info">Cargando…</p><label for="code">Código de tu aplicación</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Código de autenticación"><button id="verify" class="btn btn-primary" type="button">Verificar</button><p id="status" role="status" aria-live="polite"></p></div></main><script type="module">
import {listMfaFactors,verifyTotp,getSession} from '../assets/js/auth.js';
const params=new URLSearchParams(location.search);const raw=params.get('next')||'/perfil/';let next='/perfil/';try{const u=new URL(raw,location.origin);if(u.origin===location.origin&&u.pathname.startsWith('/')&&!u.pathname.startsWith('//'))next=u.pathname+u.search+u.hash}catch{}
const info=document.getElementById('info'),status=document.getElementById('status'),btn=document.getElementById('verify');
try{const session=await getSession();if(!session){location.replace('/');}else{const factors=await listMfaFactors(),factor=factors.totp.find(x=>x.status==='verified');if(!factor){location.replace(next)}else{info.textContent='Introduce el código de 6 dígitos de tu aplicación autenticadora.';btn.onclick=async()=>{const code=document.getElementById('code').value.replace(/D/g,'');if(code.length!==6){status.textContent='El código debe tener 6 dígitos.';return}try{btn.disabled=true;status.textContent='Verificando…';await verifyTotp(factor.id,code);location.replace(next)}catch(e){console.error(e);status.textContent='Código incorrecto o caducado.';btn.disabled=false}}}}}catch(e){console.error(e);status.textContent='No se pudo iniciar la verificación.'}</script></body></html>
