<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Verificación de seguridad</h1><p id="info">Cargando…</p><label>Código<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button id="verify" class="btn btn-primary">Verificar</button><p id="status" role="status"></p></div></main><script type="module">import {listMfaFactors,verifyTotp} from '../assets/js/auth.js';const rawNext=new URLSearchParams(location.search).get('next')||'/perfil/';let next='/perfil/';try{const u=new URL(rawNext,location.origin);if(u.origin===location.origin)next=u.pathname+u.search+u.hash}catch{}const s=document.getElementById('status');try{const f=await listMfaFactors(),factor=f.totp.find(x=>x.status==='verified');if(!factor){location.replace(next)}else{document.getElementById('info').textContent='Introduce el código de tu aplicación autenticadora.';document.getElementById('verify').onclick=async()=>{try{await verifyTotp(factor.id,document.getElementById('code').value.trim());location.replace(next)}catch{ s.textContent='Código incorrecto o caducado.'}}}}catch{ s.textContent='No se pudo iniciar la verificación.'}</script></body></html>
