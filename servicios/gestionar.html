<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de servicios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1 id="heading">Publicar servicio</h1><form id="form"><input id="serviceType" placeholder="Tipo de servicio" required><input id="businessName" placeholder="Nombre profesional/empresa"><input id="coverage" placeholder="Zona de cobertura"><input id="availability" placeholder="Disponibilidad"><input id="license" placeholder="Licencia / acreditación"><input id="price" type="number" min="0" step=".01" placeholder="Precio desde"><textarea id="description" minlength="10" maxlength="5000" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button id="submit" class="btn btn-primary">Guardar</button></form><p id="status" role="status"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const id=new URLSearchParams(location.search).get('id'),g=k=>document.getElementById(k),form=g('form'),status=g('status'),submit=g('submit');let listingId=null;
async function load(){if(!id)return;const q=await supabase.from('services').select('*').eq('id',id).eq('owner_id',s.user.id).single();if(q.error){status.textContent='Servicio no encontrado.';form.hidden=true;return}const v=q.data;g('heading').textContent='Editar servicio';submit.textContent='Guardar cambios';for(const [k,val] of [['serviceType',v.service_type],['businessName',v.business_name],['coverage',v.coverage_area],['availability',v.availability],['license',v.license_number]])g(k).value=val??'';listingId=v.listing_id;if(listingId){const l=await supabase.from('listings').select('description,price').eq('id',listingId).single();if(l.data){g('description').value=l.data.description||'';g('price').value=l.data.price??''}}}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;const listing={owner_id:s.user.id,category:'servicios',title:g('serviceType').value.trim(),description:g('description').value.trim(),price:g('price').value?Number(g('price').value):null,status:'published'};const data={owner_id:s.user.id,listing_id:listingId,service_type:g('serviceType').value.trim(),business_name:g('businessName').value.trim()||null,coverage_area:g('coverage').value.trim()||null,availability:g('availability').value.trim()||null,license_number:g('license').value.trim()||null};if(id){await supabase.from('listings').update(listing).eq('id',listingId).eq('owner_id',s.user.id);const q=await supabase.from('services').update(data).eq('id',id).eq('owner_id',s.user.id);if(q.error){status.textContent='No se pudieron guardar los cambios.';submit.disabled=false;return}}else{const l=await supabase.from('listings').insert(listing).select('id').single();if(l.error){status.textContent='No se pudo crear el anuncio.';submit.disabled=false;return}listingId=l.data.id;const q=await supabase.from('services').insert({...data,listing_id:listingId});if(q.error){await supabase.from('listings').delete().eq('id',listingId);status.textContent='No se pudo guardar el servicio.';submit.disabled=false;return}}const file=g('image').files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);if(!up.error)await supabase.from('listing_media').insert({listing_id:listingId,storage_path:u.data.path})}}location.href='../marketplace/anuncio.html?id='+listingId});load();</script></body></html>
