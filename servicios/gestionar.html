<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de servicios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1 id="heading">Publicar servicio</h1><form id="f"><input id="serviceType" placeholder="Tipo de servicio" required><input id="businessName" placeholder="Nombre profesional/empresa"><input id="coverage" placeholder="Zona de cobertura"><input id="availability" placeholder="Disponibilidad"><input id="price" type="number" step=".01" min="0" placeholder="Precio desde"><textarea id="description" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button id="submit" class="btn btn-primary">Publicar servicio</button></form><p id="s" role="status"></p></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const session=await requireAuth('../index.html');if(!session)throw new Error('auth');const id=new URLSearchParams(location.search).get('id');const s=document.getElementById('s');let listingId=null;
async function init(){if(!id)return;const q=await supabase.from('services').select('id,listing_id,service_type,business_name,coverage_area,availability').eq('id',id).eq('owner_id',session.user.id).single();if(q.error){s.textContent='Servicio no encontrado.';return}const d=q.data;listingId=d.listing_id;serviceType.value=d.service_type;businessName.value=d.business_name??'';coverage.value=d.coverage_area??'';availability.value=d.availability??'';if(listingId){const l=await supabase.from('listings').select('price,description').eq('id',listingId).eq('owner_id',session.user.id).single();if(l.data){price.value=l.data.price??'';description.value=l.data.description??''}}heading.textContent='Editar servicio';submit.textContent='Guardar cambios'}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!id){const l=await supabase.from('listings').insert({owner_id:session.user.id,category:'servicios',title:serviceType.value.trim(),description:description.value.trim(),price:price.value?Number(price.value):null}).select('id').single();if(l.error){s.textContent='No se pudo crear el anuncio.';return}listingId=l.data.id;const q=await supabase.from('services').insert({owner_id:session.user.id,listing_id:listingId,service_type:serviceType.value.trim(),business_name:businessName.value.trim(),coverage_area:coverage.value.trim(),availability:availability.value.trim()});if(q.error){await supabase.from('listings').delete().eq('id',listingId);s.textContent='No se pudo guardar el servicio.';return}}else{const l=await supabase.from('listings').update({title:serviceType.value.trim(),description:description.value.trim(),price:price.value?Number(price.value):null}).eq('id',listingId).eq('owner_id',session.user.id);if(l.error){s.textContent='No se pudo actualizar el anuncio.';return}const q=await supabase.from('services').update({service_type:serviceType.value.trim(),business_name:businessName.value.trim(),coverage_area:coverage.value.trim(),availability:availability.value.trim()}).eq('id',id).eq('owner_id',session.user.id);if(q.error){s.textContent='No se pudo actualizar el servicio.';return}}const file=image.files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);if(!up.error)await supabase.from('listing_media').insert({listing_id:listingId,storage_path:u.data.path})}}location.href='../mis-servicios/'};
init();
</script></body></html>
