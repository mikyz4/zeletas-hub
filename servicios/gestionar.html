<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de servicios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Gestionar servicio</h1><form id="f"><input id="serviceType" placeholder="Tipo de servicio" required><input id="businessName" placeholder="Nombre profesional/empresa"><input id="coverage" placeholder="Zona de cobertura"><input id="availability" placeholder="Disponibilidad"><input id="price" type="number" step=".01" placeholder="Precio desde"><textarea id="description" required placeholder="Descripción"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Publicar servicio</button></form><p id="s"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');f.onsubmit=async e=>{e.preventDefault();const l=await supabase.from('listings').insert({owner_id:s.user.id,category:'servicios',title:serviceType.value,description:description.value,price:price.value?Number(price.value):null}).select().single();if(l.error)return document.getElementById('s').textContent='No se pudo crear el anuncio.';const q=await supabase.from('services').insert({owner_id:s.user.id,listing_id:l.data.id,service_type:serviceType.value,business_name:businessName.value,coverage_area:coverage.value,availability:availability.value}).select().single();if(q.error){await supabase.from('listings').delete().eq('id',l.data.id);return document.getElementById('s').textContent='No se pudo guardar el servicio.'}const file=image.files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!u.error){await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);await supabase.from('listing_media').insert({listing_id:l.data.id,storage_path:u.data.path})}}location.href='../marketplace/anuncio.html?id='+l.data.id}</script></body></html>
