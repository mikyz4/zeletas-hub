<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel interno - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Panel interno</h1><p id="status">Cargando…</p><h2>Tiendas pendientes</h2><section id="stores" class="grid"></section><h2>Moderación</h2><section id="cases" class="grid"></section><h2>Pedidos</h2><section id="orders" class="grid"></section></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const call=body=>supabase.functions.invoke('admin-console',{body});const stores=document.getElementById('stores'),cases=document.getElementById('cases'),orders=document.getElementById('orders'),status=document.getElementById('status');try{
const st=await call({action:'list_stores'});if(st.error)throw st.error;for(const x of st.data.data||[]){const e=document.createElement('article');e.className='card';const h=document.createElement('h3');h.textContent=x.name+' · '+x.status;e.appendChild(h);const p=document.createElement('p');p.textContent=x.stripe_onboarding_complete?'Stripe configurado':'Stripe pendiente';e.appendChild(p);if(x.status==='pending'){const b=document.createElement('button');b.className='btn btn-primary';b.textContent='Activar tienda';b.onclick=async()=>{const q=await call({action:'activate_store',id:x.id});if(q.error){alert('No se pudo activar la tienda.')}else location.reload()};e.appendChild(b)}stores.appendChild(e)}
const c=await call({action:'list_cases'});if(c.error)throw c.error;for(const x of c.data.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><button>Resolver</button>';e.querySelector('h3').textContent=x.target_type+' · '+x.status;e.querySelector('p').textContent=x.reason;e.querySelector('button').onclick=async()=>{const q=await call({action:'resolve_case',id:x.id,status:'resolved',resolution:'Revisado por administración'});if(q.error){alert('No se pudo resolver el caso.')}else location.reload()};cases.appendChild(e)}
const o=await call({action:'list_orders'});if(o.error)throw o.error;for(const x of o.data.data||[]){const e=document.createElement('article');e.className='card';e.textContent=x.status+' · '+Number(x.total).toLocaleString('es-ES',{style:'currency',currency:x.currency});orders.appendChild(e)}
status.textContent='Panel cargado correctamente.'}catch(e){console.error(e);status.textContent='Acceso denegado, MFA requerido o servicio no disponible.';status.style.color='red'}
</script></body></html>
