<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel interno - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Panel interno ZELETAS</h1><p id="status">Cargando…</p><h2>Anuncios pendientes</h2><section id="pending" class="grid"></section><h2>Tiendas</h2><section id="stores" class="grid"></section><h2>Casos de moderación</h2><section id="cases" class="grid"></section><h2>Pedidos</h2><section id="orders" class="grid"></section></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const call=body=>supabase.functions.invoke('admin-console',{body}),pending=document.getElementById('pending'),stores=document.getElementById('stores'),cases=document.getElementById('cases'),orders=document.getElementById('orders'),status=document.getElementById('status');
function card(title,text){const e=document.createElement('article');e.className='card';const h=document.createElement('h3');h.textContent=title;e.appendChild(h);const p=document.createElement('p');p.textContent=text;e.appendChild(p);return e}
async function load(){try{const p=await call({action:'list_pending_listings'});if(!p.error){for(const x of p.data.data||[]){const e=card(x.title,(x.category||'')+' · '+(x.city||'')+' · '+(x.price??'Precio a consultar'));for(const [label,next] of [['Aprobar','published'],['Rechazar','rejected']]){const b=document.createElement('button');b.className='btn '+(next==='published'?'btn-primary':'btn-secondary');b.textContent=label;b.onclick=async()=>{b.disabled=true;await call({action:'set_listing_status',id:x.id,status:next});load()};e.appendChild(b)}pending.appendChild(e)}}const st=await call({action:'list_stores'});if(!st.error){for(const x of st.data.data||[]){const e=card(x.name,x.status+' · Stripe '+(x.stripe_onboarding_complete?'listo':'pendiente'));if(x.status==='pending'&&x.stripe_onboarding_complete){const b=document.createElement('button');b.className='btn btn-primary';b.textContent='Aprobar tienda';b.onclick=async()=>{b.disabled=true;await call({action:'activate_store',id:x.id});load()};e.appendChild(b)}stores.appendChild(e)}}const c=await call({action:'list_cases'});if(!c.error){for(const x of c.data.data||[]){const e=card(x.target_type+' · '+x.status,x.reason);if(x.status!=='resolved'&&x.status!=='rejected'){const b=document.createElement('button');b.className='btn btn-secondary';b.textContent='Resolver';b.onclick=async()=>{await call({action:'resolve_case',id:x.id,status:'resolved',resolution:'Revisado por administración'});load()};e.appendChild(b)}cases.appendChild(e)}}const o=await call({action:'list_orders'});if(!o.error){for(const x of o.data.data||[])orders.appendChild(card(x.status,Number(x.total).toLocaleString('es-ES',{style:'currency',currency:x.currency})))}status.textContent='Panel cargado.'}catch(e){console.error(e);status.textContent='Acceso denegado, MFA insuficiente o error de backend.';status.style.color='red'}}load();</script></body></html>
