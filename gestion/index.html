<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel interno - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Panel interno</h1><p id="status">Cargando…</p><section id="cases" class="grid"></section><h2>Pedidos</h2><section id="orders" class="grid"></section></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const call=body=>supabase.functions.invoke('admin-console',{body});const out=document.getElementById('cases'),orders=document.getElementById('orders'),status=document.getElementById('status');try{const c=await call({action:'list_cases'});if(c.error)throw c.error;for(const x of c.data.data||[]){const el=document.createElement('article');el.className='card';el.innerHTML='<h3></h3><p></p><button>Resolver</button>';el.querySelector('h3').textContent=x.target_type+' · '+x.status;el.querySelector('p').textContent=x.reason;el.querySelector('button').onclick=async()=>{await call({action:'resolve_case',id:x.id,status:'resolved',resolution:'Revisado por administración'});location.reload()};out.appendChild(el)}const o=await call({action:'list_orders'});for(const x of o.data.data||[]){const el=document.createElement('article');el.className='card';el.textContent=x.status+' · '+Number(x.total).toLocaleString('es-ES',{style:'currency',currency:x.currency});orders.appendChild(el)}status.textContent='Panel cargado.'}catch(e){console.error(e);status.textContent='Acceso denegado o MFA requerido.';status.style.color='red'}</script></body></html>
