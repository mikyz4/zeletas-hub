<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Administración ZELETAS</h1><p id="status">Cargando…</p><h2>Tiendas</h2><section id="stores" class="grid"></section><h2>Anuncios pendientes</h2><section id="listings" class="grid"></section><h2>Productos pendientes</h2><section id="products" class="grid"></section><h2>Reportes</h2><section id="cases" class="grid"></section><h2>Pedidos</h2><section id="orders" class="grid"></section></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';
const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const call=body=>supabase.functions.invoke('admin-console',{body});const status=document.getElementById('status');
function card(title,body,buttons=[]){const e=document.createElement('article');e.className='card';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=body;e.append(h,p);for(const b of buttons)e.append(b);return e}
function button(label,fn){const b=document.createElement('button');b.className='btn btn-primary';b.textContent=label;b.onclick=fn;return b}
try{
 const st=await call({action:'list_stores'});if(st.error)throw st.error;for(const x of st.data.data||[])document.getElementById('stores').append(card(x.name,x.status,new ButtonWrapper(x.status==='pending'?button('Aprobar',async()=>{await call({action:'activate_store',id:x.id});location.reload()}):null)));
 const li=await call({action:'list_listings'});if(li.error)throw li.error;for(const x of (li.data.data||[]).filter(v=>v.status==='pending_review'))document.getElementById('listings').append(card(x.title,x.category+' · '+(x.city||''),[button('Publicar',async()=>{await call({action:'moderate_listing',id:x.id,status:'published'});location.reload()}),button('Rechazar',async()=>{await call({action:'moderate_listing',id:x.id,status:'rejected'});location.reload()})]));
 const pr=await call({action:'list_products'});if(pr.error)throw pr.error;for(const x of (pr.data.data||[]).filter(v=>v.status==='pending_review'))document.getElementById('products').append(card(x.name,Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),[button('Activar',async()=>{await call({action:'moderate_product',id:x.id,status:'active'});location.reload()}),button('Rechazar',async()=>{await call({action:'moderate_product',id:x.id,status:'rejected'});location.reload()})]));
 const ca=await call({action:'list_cases'});if(ca.error)throw ca.error;for(const x of ca.data.data||[])document.getElementById('cases').append(card(x.target_type+' · '+x.status,x.reason,[button('Resolver',async()=>{await call({action:'resolve_case',id:x.id,status:'resolved',resolution:'Revisado por administración'});location.reload()})]));
 const or=await call({action:'list_orders'});if(or.error)throw or.error;for(const x of or.data.data||[])document.getElementById('orders').append(card(x.status,Number(x.total).toLocaleString('es-ES',{style:'currency',currency:x.currency})));
 status.textContent='Panel cargado correctamente.';
}catch(e){console.error(e);status.textContent='Acceso denegado, MFA requerido o servicio no disponible.';status.style.color='red'}
function ButtonWrapper(node){return node||document.createDocumentFragment()}
</script></body></html>
