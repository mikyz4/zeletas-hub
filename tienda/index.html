<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeletas | Multi-Tienda</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><header><div class="header-inner"><div class="logo">ZELETAS <span>Multi-Tienda</span></div><nav><a href="../index.html">Inicio</a> <a href="../marketplace/index.html">Marketplace</a> <a href="vendedor.html">Panel vendedor</a></nav></div></header><main class="section"><h1 class="section-title">Multi-Tienda</h1><p class="section-subtitle">Catálogo real de vendedores conectados a ZELETAS.</p><div class="card"><strong>Carrito</strong><span id="cartSummary">0 artículos</span><button id="checkout" class="btn btn-primary">Pagar carrito</button><button id="clearCart" class="btn btn-secondary">Vaciar</button><div id="cart"></div><p id="cartStatus"></p></div><section id="grid" class="grid"></section><p id="status"></p></main><script type="module">
import {supabase} from '../assets/js/supabase.js';const grid=document.getElementById('grid'),status=document.getElementById('status'),cart=document.getElementById('cart'),cartSummary=document.getElementById('cartSummary'),cartStatus=document.getElementById('cartStatus'),items=JSON.parse(localStorage.getItem('zeletas_cart')||'[]');
function save(){localStorage.setItem('zeletas_cart',JSON.stringify(items));renderCart()}function renderCart(){cart.replaceChildren();let n=0;for(const x of items){n+=x.quantity;const e=document.createElement('div');e.className='card';e.innerHTML='<span></span> <button>-</button> <b></b> <button>+</button> <button>×</button>';e.querySelector('span').textContent=x.name;e.querySelector('b').textContent=' '+x.quantity+' · '+Number(x.price*x.quantity).toLocaleString('es-ES',{style:'currency',currency:'EUR'});e.querySelectorAll('button')[0].onclick=()=>{x.quantity--;if(x.quantity<=0)items.splice(items.indexOf(x),1);save()};e.querySelectorAll('button')[1].onclick=()=>{x.quantity++;save()};e.querySelectorAll('button')[2].onclick=()=>{items.splice(items.indexOf(x),1);save()};cart.appendChild(e)}cartSummary.textContent=n+' artículo'+(n===1?'':'s')}renderCart();document.getElementById('clearCart').onclick=()=>{items.splice(0);save()};document.getElementById('checkout').onclick=async()=>{cartStatus.textContent='Preparando pago…';const r=await supabase.functions.invoke('stripe-checkout',{body:{items:items.map(x=>({productId:x.id,quantity:x.quantity}))}});if(r.error){cartStatus.textContent='No se pudo iniciar el pago. Inicia sesión y comprueba que el vendedor tenga los pagos activos.';return}location.href=r.data.url};
const q=await supabase.from('products').select('id,name,description,price,stock,store_id,stores(name,status)').eq('status','active').gt('stock',0).order('created_at',{ascending:false});if(q.error){status.textContent='No se pudo cargar la tienda.'}else if(!q.data?.length){status.textContent='Todavía no hay productos publicados.'}else{for(const p of q.data){if(p.stores?.status!=='active')continue;const im=await supabase.from('product_images').select('storage_path,alt_text').eq('product_id',p.id).order('sort_order').limit(1);const e=document.createElement('article');e.className='card';if(im.data?.[0]){const img=document.createElement('img');img.loading='lazy';img.alt=im.data[0].alt_text||p.name;img.style.maxWidth='100%';img.src=supabase.storage.from('media').getPublicUrl(im.data[0].storage_path).data.publicUrl;e.appendChild(img)}const h=document.createElement('h3');h.textContent=p.name;e.appendChild(h);const d=document.createElement('p');d.textContent=p.description||'';e.appendChild(d);const s=document.createElement('small');s.textContent=p.stores.name;e.appendChild(s);const b=document.createElement('p');b.textContent=Number(p.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'});e.appendChild(b);const btn=document.createElement('button');btn.className='btn btn-primary';btn.textContent='Añadir al carrito';btn.onclick=()=>{const existing=items.find(x=>x.id===p.id);if(existing)existing.quantity++;else items.push({id:p.id,name:p.name,price:Number(p.price),storeId:p.store_id,quantity:1});const stores=new Set(items.map(x=>x.storeId));if(stores.size>1){items.pop();cartStatus.textContent='Por ahora cada pago debe pertenecer a una sola tienda.'}else cartStatus.textContent='Producto añadido.';save()};e.appendChild(btn);grid.appendChild(e)}} 
</script></body></html>
