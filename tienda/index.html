<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeletas | Multi-Tienda</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><header><div class="header-inner"><div class="logo">ZELETAS <span>Multi-Tienda</span></div><nav><a href="../index.html">Inicio</a> <a href="../marketplace/index.html">Marketplace</a> <a href="vendedor.html">Panel vendedor</a></nav></div></header><main class="section"><h1 class="section-title">Multi-Tienda</h1><p class="section-subtitle">Catálogo real de vendedores conectados a ZELETAS.</p><section id="grid" class="grid"></section><p id="status"></p></main><script type="module">
import {supabase} from '../assets/js/supabase.js';const grid=document.getElementById('grid'),status=document.getElementById('status');const q=await supabase.from('products').select('id,name,description,price,stock,stores(name,slug)').eq('status','active').gt('stock',0).order('created_at',{ascending:false});if(q.error){status.textContent='No se pudo cargar la tienda.'}else if(!q.data?.length){status.textContent='Todavía no hay productos publicados.'}else{for(const p of q.data){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><small></small><strong></strong><br><button class="btn btn-primary">Comprar</button>';e.querySelector('h3').textContent=p.name;e.querySelector('p').textContent=p.description||'';e.querySelector('small').textContent=p.stores?.name||'Vendedor';e.querySelector('strong').textContent=Number(p.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'});e.querySelector('button').onclick=async()=>{const {data:{session}}=await supabase.auth.getSession();if(!session){location.href='../index.html#cuenta';return}const r=await supabase.functions.invoke('stripe-checkout',{body:{items:[{productId:p.id,quantity:1}]}});if(r.error){alert('No se pudo iniciar el pago.')}else location.href=r.data.url};grid.appendChild(e)}} 
</script></body></html>
