<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar producto - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Editar producto</h1><form id="form"><input id="name" maxlength="160" required><input id="slug" maxlength="100" required><input id="price" type="number" min="0" step=".01" required><input id="stock" type="number" min="0" required><select id="status"><option value="draft">Borrador</option><option value="active">Activo</option><option value="paused">Pausado</option><option value="archived">Archivado</option></select><textarea id="description"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Guardar</button></form><p id="statusMsg" role="status"></p><button id="delete" class="btn btn-secondary">Eliminar producto</button></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const id=new URLSearchParams(location.search).get('id'),g=x=>document.getElementById(x),form=g('form'),msg=g('statusMsg');if(!id){msg.textContent='Producto no encontrado.';form.hidden=true}else{const p=await supabase.from('products').select('id,name,slug,price,stock,status,description,store_id,stores(owner_id)').eq('id',id).single();if(p.error||p.data.stores.owner_id!==s.user.id){msg.textContent='No autorizado.';form.hidden=true}else{g('name').value=p.data.name;g('slug').value=p.data.slug;g('price').value=p.data.price;g('stock').value=p.data.stock;g('status').value=p.data.status;g('description').value=p.data.description||'';form.addEventListener('submit',async e=>{e.preventDefault();const q=await supabase.from('products').update({name:g('name').value.trim(),slug:g('slug').value.trim().toLowerCase(),price:Number(g('price').value),stock:Number(g('stock').value),status:g('status').value,description:g('description').value.trim()}).eq('id',id);if(q.error){msg.textContent='No se pudo guardar.';return}const f=g('image').files[0];if(f){const u=await supabase.functions.invoke('media-upload',{body:{contentType:f.type}});if(!u.error){const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,f);if(!up.error){await supabase.from('product_images').insert({product_id:id,storage_path:u.data.path})}}}location.href='vendedor.html'});g('delete').onclick=async()=>{if(!confirm('Eliminar producto?'))return;const q=await supabase.from('products').delete().eq('id',id);if(q.error){msg.textContent='No se pudo eliminar.';return}location.href='vendedor.html'}}}</script></body></html>
