<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de vendedor - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Panel de vendedor</h1><p id="status">Cargando…</p><form id="storeForm"><input id="storeName" placeholder="Nombre de tienda" maxlength="120" required><input id="storeSlug" placeholder="slug-tienda" maxlength="80" required><textarea id="storeDescription" placeholder="Descripción"></textarea><button class="btn btn-primary">Crear tienda</button></form><button id="onboard" class="btn btn-secondary" hidden>Configurar cobros Stripe</button></div><div class="card"><h2>Nuevo producto</h2><form id="productForm"><input id="productName" placeholder="Producto" maxlength="160" required><input id="productSlug" placeholder="slug-producto" maxlength="100" required><input id="productPrice" type="number" min="0" step=".01" placeholder="Precio" required><input id="productStock" type="number" min="0" placeholder="Stock" required><textarea id="productDescription" placeholder="Descripción"></textarea><input id="productImage" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Guardar producto</button></form><p id="productStatus"></p></div><div id="products" class="grid"></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');let store=null;
async function load(){const q=await supabase.from('stores').select('id,name,slug,description,logo_url,status,owner_id,created_at,updated_at').eq('owner_id',s.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();store=q.data;if(store){document.getElementById('storeForm').hidden=true;document.getElementById('onboard').hidden=false;document.getElementById('status').textContent='Tienda: '+store.name+' · '+store.status;loadProducts()}}
async function loadProducts(){const q=await supabase.from('products').select('id,store_id,name,slug,description,price,stock,status,created_at,updated_at').eq('store_id',store.id).order('created_at',{ascending:false});const box=document.getElementById('products');box.replaceChildren();for(const p of q.data||[]){const el=document.createElement('article');el.className='card';el.textContent=p.name+' · '+Number(p.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'})+' · stock '+p.stock;box.appendChild(el)}}
document.getElementById('storeForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await supabase.from('stores').insert({owner_id:s.user.id,name:storeName.value.trim(),slug:storeSlug.value.trim().toLowerCase(),description:storeDescription.value.trim()}).select().single();if(error){status.textContent='No se pudo crear la tienda.';return}store=data;status.textContent='Tienda creada.';storeForm.hidden=true;onboard.hidden=false};
document.getElementById('onboard').onclick=async()=>{const r=await supabase.functions.invoke('store-onboarding',{body:{storeId:store.id}});if(r.error){alert('Stripe aún no está configurado.')}else location.href=r.data.url};
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();if(!store)return alert('Crea primero la tienda');const q=await supabase.from('products').insert({store_id:store.id,name:productName.value.trim(),slug:productSlug.value.trim().toLowerCase(),price:Number(productPrice.value),stock:Number(productStock.value),description:productDescription.value.trim(),status:'pending_review'}).select().single();if(q.error){productStatus.textContent='No se pudo guardar el producto.';return}const file=productImage.files[0];if(file){const r=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(!r.error){await supabase.storage.from('media').uploadToSignedUrl(r.data.path,r.data.token,file);await supabase.from('product_images').insert({product_id:q.data.id,storage_path:r.data.path})}}productStatus.textContent='Producto enviado a revisión.';e.target.reset();loadProducts()};
load();
</script></body></html>
