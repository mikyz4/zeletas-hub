<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de vendedor - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Panel de vendedor</h1><p id="status">Cargando…</p><form id="storeForm"><input id="storeName" placeholder="Nombre de tienda" maxlength="120" required><input id="storeSlug" placeholder="slug-tienda" maxlength="80" required><textarea id="storeDescription" placeholder="Descripción"></textarea><button class="btn btn-primary">Crear tienda</button></form><button id="onboard" class="btn btn-secondary" hidden>Configurar cobros Stripe</button></div><div class="card"><h2>Nuevo producto</h2><form id="productForm"><input id="productName" placeholder="Producto" maxlength="160" required><input id="productSlug" placeholder="slug-producto" maxlength="100" required><input id="productPrice" type="number" min="0" step=".01" placeholder="Precio" required><input id="productStock" type="number" min="0" placeholder="Stock" required><textarea id="productDescription" placeholder="Descripción"></textarea><input id="productImage" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Guardar producto</button></form><p id="productStatus"></p></div><div id="products" class="grid"></div><div class="card"><h2>Pedidos</h2><div id="orders"></div></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth,createStore} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const orders=document.getElementById('orders'),storeForm=document.getElementById('storeForm'),storeName=document.getElementById('storeName'),storeSlug=document.getElementById('storeSlug'),storeDescription=document.getElementById('storeDescription'),storeStatus=document.getElementById('status'),onboard=document.getElementById('onboard'),productForm=document.getElementById('productForm'),productName=document.getElementById('productName'),productSlug=document.getElementById('productSlug'),productPrice=document.getElementById('productPrice'),productStock=document.getElementById('productStock'),productDescription=document.getElementById('productDescription'),productImage=document.getElementById('productImage'),productStatus=document.getElementById('productStatus'),products=document.getElementById('products');let store=null;
async function load(){const q=await supabase.from('stores').select('*').eq('owner_id',s.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(q.error){storeStatus.textContent='No se pudo cargar la tienda.';return}store=q.data;if(store){storeForm.hidden=true;onboard.hidden=false;storeStatus.textContent='Tienda: '+store.name+' · '+store.status;await loadProducts();await loadOrders()}}
async function loadOrders(){const q=await supabase.from('orders').select('id,status,total,currency,created_at').eq('store_id',store.id).order('created_at',{ascending:false}).limit(50);orders.replaceChildren();for(const o of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<span></span> <select><option value="processing">Procesando</option><option value="shipped">Enviado</option><option value="completed">Completado</option></select> <button class="btn btn-secondary">Guardar</button>';e.querySelector('span').textContent=o.status+' · '+Number(o.total).toLocaleString('es-ES',{style:'currency',currency:o.currency});const select=e.querySelector('select');select.value=['processing','shipped','completed'].includes(o.status)?o.status:'processing';e.querySelector('button').onclick=async()=>{const r=await supabase.from('orders').update({status:select.value}).eq('id',o.id).eq('store_id',store.id);if(r.error)alert('No se pudo actualizar el pedido.');else loadOrders()};orders.appendChild(e)}}async function loadProducts(){const q=await supabase.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});products.replaceChildren();if(q.error)return;for(const p of q.data||[]){const el=document.createElement('article');el.className='card';el.innerHTML='<span></span> <a class="btn btn-secondary">Editar</a>';el.querySelector('span').textContent=p.name+' · '+Number(p.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'})+' · stock '+p.stock;el.querySelector('a').href='editar-producto.html?id='+p.id;products.appendChild(el)}}
storeForm.addEventListener('submit',async e=>{e.preventDefault();try{const r=await createStore({name:storeName.value.trim(),slug:storeSlug.value.trim().toLowerCase(),description:storeDescription.value.trim()});store=r.store;storeStatus.textContent='Tienda creada y pendiente de aprobación.';storeForm.hidden=true;onboard.hidden=false}catch(error){console.error(error);storeStatus.textContent='No se pudo crear la tienda.'}});
onboard.addEventListener('click',async()=>{onboard.disabled=true;const r=await supabase.functions.invoke('store-onboarding',{body:{storeId:store.id}});if(r.error){alert('Stripe aún no está configurado o el onboarding no está listo.');onboard.disabled=false;return}if(r.data.ready){storeStatus.textContent='Stripe ya está verificado. Espera la aprobación interna.';onboard.disabled=false;return}location.href=r.data.url});
productForm.addEventListener('submit',async e=>{e.preventDefault();if(!store)return alert('Crea primero la tienda');const amount=Number(productPrice.value),stock=Number(productStock.value);if(!Number.isFinite(amount)||amount<0||!Number.isInteger(stock)||stock<0)return;const q=await supabase.from('products').insert({store_id:store.id,name:productName.value.trim(),slug:productSlug.value.trim().toLowerCase(),price:amount,stock,description:productDescription.value.trim(),status:'active'}).select().single();if(q.error){productStatus.textContent='No se pudo guardar el producto.';return}const file=productImage.files[0];if(file){const r=await supabase.functions.invoke('media-upload',{body:{contentType:file.type}});if(r.error){productStatus.textContent='Producto guardado, pero la imagen no pudo prepararse.'}else{const u=await supabase.storage.from('media').uploadToSignedUrl(r.data.path,r.data.token,file);if(u.error){productStatus.textContent='Producto guardado, pero la imagen no pudo subirse.'}else{const m=await supabase.from('product_images').insert({product_id:q.data.id,storage_path:r.data.path});if(m.error)productStatus.textContent='Producto guardado, pero no se pudo asociar la imagen.'}}}}if(!productStatus.textContent)productStatus.textContent='Producto guardado.';e.target.reset();await loadProducts()});load();</script></body></html>
