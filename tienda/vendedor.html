<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de vendedor - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Panel de vendedor</h1><p id="status">Cargando…</p><form id="storeForm"><label for="storeName">Nombre de tienda</label><input id="storeName" maxlength="120" required><label for="storeSlug">Slug</label><input id="storeSlug" maxlength="80" pattern="[a-z0-9-]{2,80}" required><label for="storeDescription">Descripción</label><textarea id="storeDescription"></textarea><button class="btn btn-primary">Crear tienda</button></form><button id="onboard" class="btn btn-secondary" hidden>Configurar cobros Stripe</button></div><div class="card"><h2>Nuevo producto</h2><form id="productForm"><label for="productName">Producto</label><input id="productName" maxlength="160" required><label for="productSlug">Slug</label><input id="productSlug" maxlength="100" pattern="[a-z0-9-]{2,100}" required><label for="productPrice">Precio</label><input id="productPrice" type="number" min="0" step=".01" required><label for="productStock">Stock</label><input id="productStock" type="number" min="0" required><label for="productDescription">Descripción</label><textarea id="productDescription"></textarea><label for="productImage">Imagen</label><input id="productImage" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn btn-primary">Guardar producto</button></form><p id="productStatus" role="status"></p></div><div id="products" class="grid"></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';
const session=await requireAuth('../index.html');if(!session)throw new Error('auth');const $=id=>document.getElementById(id);let store=null;
async function load(){const q=await supabase.from('stores').select('id,name,status,stripe_onboarding_complete').eq('owner_id',session.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(q.error){$('status').textContent='No se pudo cargar la tienda.';return}store=q.data;if(!store){$('status').textContent='Todavía no tienes una tienda.';return}$('storeForm').hidden=true;$('onboard').hidden=false;$('status').textContent='Tienda: '+store.name+' · '+store.status;await loadProducts()}
async function loadProducts(){const q=await supabase.from('products').select('id,name,price,stock,status').eq('store_id',store.id).order('created_at',{ascending:false});const box=$('products');box.replaceChildren();if(q.error){$('status').textContent='No se pudieron cargar los productos.';return}for(const p of q.data||[]){const el=document.createElement('article');el.className='card';el.textContent=p.name+' · '+Number(p.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'})+' · stock '+p.stock+' · '+p.status;box.appendChild(el)}}
$('storeForm').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='Creando tienda…';const q=await supabase.functions.invoke('store-create',{body:{name:$('storeName').value.trim(),slug:$('storeSlug').value.trim().toLowerCase(),description:$('storeDescription').value.trim()}});if(q.error){$('status').textContent='No se pudo crear la tienda.';return}store=q.data.store;$('storeForm').hidden=true;$('onboard').hidden=false;$('status').textContent='Tienda creada y pendiente de aprobación.'});
$('onboard').addEventListener('click',async()=>{const q=await supabase.functions.invoke('store-onboarding',{body:{storeId:store.id}});if(q.error){$('status').textContent='Stripe todavía no está configurado.';return}location.href=q.data.url});
$('productForm').addEventListener('submit',async e=>{e.preventDefault();if(!store){$('productStatus').textContent='Crea primero una tienda.';return}const q=await supabase.from('products').insert({store_id:store.id,name:$('productName').value.trim(),slug:$('productSlug').value.trim().toLowerCase(),price:Number($('productPrice').value),stock:Number($('productStock').value),description:$('productDescription').value.trim(),status:'pending_review'}).select().single();if(q.error){$('productStatus').textContent='No se pudo guardar el producto.';return}const file=$('productImage').files[0];if(file){const u=await supabase.functions.invoke('media-upload',{body:{contentType:file.type,size:file.size,entityType:'product',entityId:q.data.id}});if(u.error){await supabase.from('products').delete().eq('id',q.data.id);$('productStatus').textContent='No se pudo preparar la imagen.';return}const up=await supabase.storage.from('media').uploadToSignedUrl(u.data.path,u.data.token,file);if(up.error){await supabase.from('products').delete().eq('id',q.data.id);$('productStatus').textContent='No se pudo subir la imagen.';return}const img=await supabase.from('product_images').insert({product_id:q.data.id,storage_path:u.data.path});if(img.error)console.error(img.error)}$('productStatus').textContent='Producto enviado a moderación.';e.target.reset();await loadProducts()});load();
</script></body></html>
