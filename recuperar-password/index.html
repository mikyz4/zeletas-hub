<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Zeletas Hub</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<section class="hero">
  <h2>Recuperar contraseña</h2>
  <form id="recuperarForm">
    <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email" required>
    <button type="submit">Enviar enlace de recuperación</button>
  </form>
  <p><a href="../index.html">Volver al inicio</a></p>
  <div id="mensaje"></div>
</section>
<script type="module">
import { requestPasswordReset } from '../assets/js/auth.js';

const form = document.getElementById('recuperarForm');
const mensaje = document.getElementById('mensaje');

form.addEventListener('submit', async event => {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();

  try {
    await requestPasswordReset(email);
    mensaje.textContent = 'Si la cuenta existe, recibirás un enlace de recuperación por correo.';
    mensaje.style.color = 'green';
    form.reset();
  } catch (error) {
    console.error('Error solicitando recuperación:', error);
    mensaje.textContent = 'No se pudo solicitar la recuperación. Inténtalo de nuevo.';
    mensaje.style.color = 'red';
  }
});
</script>
</body>
</html>
