<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi Perfil - ZELETAS HUB</title><link rel="stylesheet" href="../assets/css/styles.css"></head>
<body><main class="section" style="max-width:1100px;margin:auto">
<div class="card">
<h1>Mi perfil</h1><p id="accountContact">Cargando…</p>
<form id="profileForm">
<label>Nombre completo<input id="displayName" maxlength="120"></label>
<label>Dirección<input id="address" maxlength="250"></label>
<label>Género<input id="gender" maxlength="80"></label>
<label>Fecha de nacimiento<input id="birthdate" type="date"></label>
<label>Biografía<textarea id="bio" maxlength="1000"></textarea></label>
<label><input id="publicProfile" type="checkbox"> Perfil público</label>
<label><input id="smsAlerts" type="checkbox"> Alertas SMS</label>
<button class="btn btn-primary" type="submit">Guardar cambios</button>
</form><p id="status" role="status" aria-live="polite"></p>
</div>
<div class="grid">
<a class="card" href="../marketplace/general.html">Marketplace</a>
<a class="card" href="../chat/index.html">Mensajes</a>
<a class="card" href="../contacto/index.html">Soporte</a>
</div>
<div class="card">
<h2>Seguridad</h2><button id="resetPassword" class="btn btn-secondary">Cambiar contraseña</button>
<button id="deleteAccount" class="btn btn-secondary" style="margin-left:8px">Eliminar cuenta</button>
<button id="logout" class="btn btn-primary" style="margin-left:8px">Cerrar sesión</button>
</div></main>
<script type="module">
import { supabase } from '../assets/js/supabase.js';
import { requireAuth,requestPasswordReset,deleteCurrentAccount } from '../assets/js/auth.js';
const $=id=>document.getElementById(id);let user;
async function init(){
 const session=await requireAuth('../index.html');if(!session)return;user=session.user;
 $('accountContact').textContent=user.email||user.phone||'Sin contacto';
 const {data,error}=await supabase.from('profiles').select('*').eq('user_id',user.id).single();
 if(error){$('status').textContent='No se pudo cargar el perfil.';return;}
 $('displayName').value=data.display_name||user.user_metadata?.full_name||'';
 $('address').value=data.address||'';$('gender').value=data.gender||'';$('birthdate').value=data.birthdate||'';
 $('bio').value=data.bio||'';$('publicProfile').checked=data.public_profile;$('smsAlerts').checked=data.sms_alerts;
}
$('profileForm').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='Guardando…';
 const {error}=await supabase.from('profiles').update({display_name:$('displayName').value.trim(),address:$('address').value.trim()||null,gender:$('gender').value.trim()||null,birthdate:$('birthdate').value||null,bio:$('bio').value.trim()||null,public_profile:$('publicProfile').checked,sms_alerts:$('smsAlerts').checked}).eq('user_id',user.id);
 $('status').textContent=error?'No se pudieron guardar los cambios.':'Cambios guardados.';$('status').style.color=error?'red':'green';});
$('resetPassword').onclick=async()=>{if(!user?.email)return alert('Esta cuenta no tiene correo para recuperación.');try{await requestPasswordReset(user.email);alert('Si la cuenta puede recuperar contraseña, recibirás un enlace.')}catch{alert('No se pudo solicitar la recuperación.')}};
$('deleteAccount').onclick=async()=>{if(!confirm('Esta acción elimina la cuenta de forma irreversible. ¿Continuar?'))return;try{await deleteCurrentAccount();location.replace('../index.html')}catch(e){console.error(e);alert('No se pudo eliminar la cuenta.')}};
$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('../index.html')};
init();
</script></body></html>
