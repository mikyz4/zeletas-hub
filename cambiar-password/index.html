<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - Zeletas Hub</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<section class="hero">
  <h2>Crear nueva contraseña</h2>
  <form id="passwordForm">
    <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Nueva contraseña" required>
    <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repite la contraseña" required>
    <button type="submit">Guardar contraseña</button>
  </form>
  <p id="mensaje"></p>
</section>
<script type="module">
import { supabase } from '../assets/js/supabase.js';
import { updatePassword } from '../assets/js/auth.js';

const form = document.getElementById('passwordForm');
const mensaje = document.getElementById('mensaje');

let recoverySession = false;

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && session) {
    recoverySession = true;
  }
});

form.addEventListener('submit', async event => {
  event.preventDefault();

  const password = document.getElementById('password').value;
  const confirmation = document.getElementById('passwordConfirm').value;

  if (password.length < 8) {
    mensaje.textContent = 'La contraseña debe tener al menos 8 caracteres.';
    mensaje.style.color = 'red';
    return;
  }

  if (password !== confirmation) {
    mensaje.textContent = 'Las contraseñas no coinciden.';
    mensaje.style.color = 'red';
    return;
  }

  try {
    await updatePassword(password);
    recoverySession = true;
    mensaje.textContent = 'Contraseña actualizada correctamente.';
    mensaje.style.color = 'green';
    form.reset();
    setTimeout(() => window.location.replace('/perfil/'), 1000);
  } catch (error) {
    console.error('Error actualizando contraseña:', error);
    mensaje.textContent = 'No se pudo actualizar la contraseña. Abre de nuevo el enlace recibido por correo.';
    mensaje.style.color = 'red';
  }
});
</script>
</body>
</html>
