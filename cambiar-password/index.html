<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><section class="hero"><h2>Crear nueva contraseña</h2><p id="guard" role="status">Esperando un enlace de recuperación válido…</p><form id="passwordForm" hidden><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Nueva contraseña" required><input id="passwordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repite la contraseña" required><button type="submit">Guardar contraseña</button></form><p id="mensaje"></p><a href="../index.html">Volver al inicio</a></section><script type="module">
import {supabase} from '../assets/js/supabase.js';import {updatePassword} from '../assets/js/auth.js';
const form=document.getElementById('passwordForm'),mensaje=document.getElementById('mensaje'),guard=document.getElementById('guard');let recovery=false;
if(new URLSearchParams(location.search).get('type')==='recovery'||location.hash.includes('type=recovery'))recovery=true;
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){recovery=true;form.hidden=false;guard.textContent='Enlace válido. Crea tu nueva contraseña.'}});
const session=(await supabase.auth.getSession()).data.session;
if(recovery&&session){form.hidden=false;guard.textContent='Enlace válido. Crea tu nueva contraseña.'}
form.addEventListener('submit',async e=>{e.preventDefault();if(!recovery){mensaje.textContent='Abre de nuevo el enlace de recuperación recibido por correo.';mensaje.style.color='red';return}const p=document.getElementById('password').value,c=document.getElementById('passwordConfirm').value;if(p.length<8){mensaje.textContent='La contraseña debe tener al menos 8 caracteres.';mensaje.style.color='red';return}if(p!==c){mensaje.textContent='Las contraseñas no coinciden.';mensaje.style.color='red';return}try{await updatePassword(p);mensaje.textContent='Contraseña actualizada correctamente.';mensaje.style.color='green';form.reset();setTimeout(()=>location.replace('/perfil/'),1000)}catch(e){console.error(e);mensaje.textContent='No se pudo actualizar la contraseña. Abre de nuevo el enlace recibido por correo.';mensaje.style.color='red'}});</script></body></html>
