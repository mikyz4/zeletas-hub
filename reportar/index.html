<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportar contenido - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section" style="max-width:700px;margin:auto"><div class="card"><h1>Reportar contenido</h1><p>Describe el motivo para que nuestro equipo pueda revisarlo.</p><form id="f"><input id="target" type="hidden"><input id="targetType" type="hidden"><label for="reason">Motivo</label><textarea id="reason" minlength="3" maxlength="500" required></textarea><button class="btn btn-primary" type="submit">Enviar reporte</button></form><p id="status" role="status"></p></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const p=new URLSearchParams(location.search);document.getElementById('target').value=p.get('id')||'';document.getElementById('targetType').value=p.get('type')||'listing';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const type=document.getElementById('targetType').value,id=document.getElementById('target').value;if(!id||!['listing','product','store','profile','message'].includes(type)){document.getElementById('status').textContent='Reporte inválido.';return}const q=await supabase.from('moderation_cases').insert({target_type:type,target_id:id,reporter_id:s.user.id,reason:document.getElementById('reason').value.trim()});if(q.error){document.getElementById('status').textContent='No se pudo enviar el reporte.';return}document.getElementById('status').textContent='Reporte enviado. Gracias por avisarnos.';e.target.reset()})</script></body></html>
