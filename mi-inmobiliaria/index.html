<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi inmobiliaria - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mi inmobiliaria</h1><p id="status">Cargando…</p><div id="list" class="grid"></div><a class="btn btn-primary" href="../inmobiliaria/gestionar.html">+ Publicar inmueble</a></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const box=document.getElementById('list'),status=document.getElementById('status');async function load(){const q=await supabase.from('properties').select('id,property_type,operation,area_m2,bedrooms,bathrooms,city,listing_id').eq('owner_id',s.user.id).order('created_at',{ascending:false});if(q.error){status.textContent='No se pudieron cargar tus inmuebles.';return}status.textContent=q.data?.length?'':'No tienes inmuebles todavía.';box.replaceChildren();for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><a class="btn btn-secondary">Ver anuncio</a> <button class="btn btn-secondary">Eliminar</button>';e.querySelector('h3').textContent=x.property_type+' · '+x.operation;e.querySelector('p').textContent=(x.city||'')+' · '+(x.area_m2||'—')+' m² · '+(x.bedrooms??'—')+' hab';const a=e.querySelector('a');if(x.listing_id)a.href='../marketplace/anuncio.html?id='+x.listing_id;else a.remove();e.querySelector('button').onclick=async()=>{if(!confirm('Eliminar este inmueble?'))return;const r=await supabase.from('properties').delete().eq('id',x.id);if(r.error)alert('No se pudo eliminar.');else{if(x.listing_id)await supabase.from('listings').delete().eq('id',x.listing_id);load()}};box.appendChild(e)}}load();</script></body></html>
