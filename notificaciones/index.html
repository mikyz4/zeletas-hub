<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Notificaciones</h1><div id="list" class="grid"></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';
const session=await requireAuth('../index.html');if(!session)throw new Error('auth');const box=document.getElementById('list');const seen=new Set();
function render(n){if(seen.has(n.id))return;seen.add(n.id);const e=document.createElement('article');e.className='card';e.dataset.notificationId=n.id;const h=document.createElement('h3');h.textContent=n.title;const p=document.createElement('p');p.textContent=n.body;e.append(h,p);box.prepend(e)}
const q=await supabase.from('notifications').select('id,title,body,data,read_at,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false});for(const n of q.data||[]){render(n);if(!n.read_at)await supabase.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.id)}
const channel=supabase.channel('notifications-'+session.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},payload=>render(payload.new)).subscribe();
window.addEventListener('beforeunload',()=>supabase.removeChannel(channel));
</script></body></html>
