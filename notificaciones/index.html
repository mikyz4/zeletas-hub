<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Notificaciones</h1><div id="list" class="grid"></div></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const q=await supabase.from('notifications').select('*').eq('user_id',s.user.id).order('created_at',{ascending:false});const box=document.getElementById('list');for(const n of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p>';e.querySelector('h3').textContent=n.title;e.querySelector('p').textContent=n.body;if(!n.read_at)await supabase.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.id);box.appendChild(e)}</script></body></html>
