<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis anuncios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis anuncios</h1><p id="status">Cargando…</p><section id="list" class="grid"></section><a class="btn btn-primary" href="../marketplace/publicar.html">Nuevo anuncio</a></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const q=await supabase.from('listings').select('id,title,category,price,city,status,created_at').eq('owner_id',s.user.id).order('created_at',{ascending:false});const box=document.getElementById('list');for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><small></small><div><a class="btn btn-secondary">Editar</a> <a class="btn btn-primary">Ver</a> <button class="btn btn-secondary">Eliminar</button></div>';e.querySelector('h3').textContent=x.title;e.querySelector('p').textContent=x.category+' · '+(x.city||'');e.querySelector('small').textContent=x.status+(x.price!=null?' · '+Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'}):'');const [edit,view]=e.querySelectorAll('a');edit.href='../marketplace/publicar.html?id='+x.id;view.href='../marketplace/anuncio.html?id='+x.id;e.querySelector('button').onclick=async()=>{if(!confirm('Eliminar este anuncio?'))return;const r=await supabase.functions.invoke('delete-listing',{body:{listingId:x.id}});if(r.error){alert('No se pudo eliminar.');return}location.reload()};box.appendChild(e)}document.getElementById('status').textContent=q.error?'No se pudieron cargar los anuncios.':((q.data||[]).length?'':'Todavía no tienes anuncios.')||'';</script></body></html>
