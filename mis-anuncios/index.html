<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis anuncios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis anuncios</h1><p><a class="btn btn-primary" href="../marketplace/publicar.html">Nuevo anuncio</a></p><div id="list" class="grid"></div><p id="status"></p></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';import {deleteCurrentAccount} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const q=await supabase.from('listings').select('id,title,category,price,city,status,created_at').eq('owner_id',s.user.id).order('created_at',{ascending:false}),box=document.getElementById('list'),status=document.getElementById('status');if(q.error){status.textContent='No se pudieron cargar tus anuncios.'}else{for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><small></small><br><a class="btn btn-secondary">Ver</a> <button>Eliminar</button>';e.querySelector('h3').textContent=x.title;e.querySelector('p').textContent=x.category+' · '+(x.price==null?'Precio a consultar':Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'}));e.querySelector('small').textContent=x.status+(x.city?' · '+x.city:'');e.querySelector('a').href='../marketplace/anuncio.html?id='+encodeURIComponent(x.id);e.querySelector('button').onclick=async()=>{if(!confirm('¿Eliminar este anuncio?'))return;const r=await supabase.functions.invoke('delete-listing',{body:{listingId:x.id}});if(r.error){status.textContent='No se pudo eliminar el anuncio.'}else location.reload()};box.appendChild(e)}}</script></body></html>
