<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis anuncios - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><h1>Mis anuncios</h1><p id="status">Cargando…</p><div id="list" class="grid"></div><a class="btn btn-primary" href="../marketplace/publicar.html">+ Publicar anuncio</a></main><script type="module">import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const box=document.getElementById('list'),status=document.getElementById('status');async function load(){const q=await supabase.from('listings').select('id,title,status,price,city,created_at').eq('owner_id',s.user.id).order('created_at',{ascending:false});if(q.error){status.textContent='No se pudieron cargar tus anuncios.';return}status.textContent=q.data?.length?'':'No tienes anuncios todavía.';box.replaceChildren();for(const x of q.data||[]){const e=document.createElement('article');e.className='card';e.innerHTML='<h3></h3><p></p><a class="btn btn-secondary">Ver</a> <button class="btn btn-secondary">Eliminar</button>';e.querySelector('h3').textContent=x.title;e.querySelector('p').textContent=(x.city?x.city+' · ':'')+(x.price==null?'Precio a consultar':Number(x.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'}))+' · '+x.status;e.querySelector('a').href='../marketplace/anuncio.html?id='+x.id;e.querySelector('button').onclick=async()=>{if(!confirm('Eliminar este anuncio?'))return;const r=await supabase.from('listings').delete().eq('id',x.id);if(r.error)alert('No se pudo eliminar.');else load()};box.appendChild(e)}}load();</script></body></html>
