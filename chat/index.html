<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensajes - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card"><h1>Mensajes</h1><p id="status">Cargando…</p><div id="messages" style="min-height:260px;max-height:55vh;overflow:auto"></div><form id="form" style="display:flex;gap:8px;margin-top:15px"><input id="body" maxlength="5000" placeholder="Escribe un mensaje…" required style="flex:1"><button class="btn btn-primary">Enviar</button></form></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';const s=await requireAuth('../index.html');if(!s)throw new Error('auth');const cid=new URLSearchParams(location.search).get('conversation'),status=document.getElementById('status'),box=document.getElementById('messages'),form=document.getElementById('form');
if(!cid){status.textContent='Selecciona una conversación desde un anuncio.';form.hidden=true}
async function load(){if(!cid)return;const q=await supabase.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',cid).order('created_at',{ascending:true});if(q.error){status.textContent='No se pudieron cargar los mensajes.';return}status.textContent='';box.replaceChildren();for(const m of q.data||[]){const p=document.createElement('p');p.textContent=(m.sender_id===s.user.id?'Tú: ':'Usuario: ')+m.body;box.appendChild(p)}box.scrollTop=box.scrollHeight}await load();
form.addEventListener('submit',async e=>{e.preventDefault();const body=document.getElementById('body').value.trim();if(!body)return;const q=await supabase.from('messages').insert({conversation_id:cid,sender_id:s.user.id,body});if(q.error){status.textContent='No se pudo enviar el mensaje.';return}document.getElementById('body').value='';await load()});
if(cid)supabase.channel('zeletas-chat-'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},()=>load()).subscribe();
</script></body></html>
