<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensajes - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="section"><div class="card" style="max-width:850px;margin:auto"><h1>Mensajes</h1><p id="status">Cargando…</p><div id="messages" style="min-height:260px;max-height:55vh;overflow:auto"></div><form id="form" style="display:flex;gap:8px;margin-top:15px"><input id="body" maxlength="5000" placeholder="Escribe un mensaje…" required style="flex:1"><button class="btn btn-primary">Enviar</button></form><a href="../perfil/" class="btn btn-secondary" style="margin-top:15px">Volver al perfil</a></div></main><script type="module">
import {supabase} from '../assets/js/supabase.js';import {requireAuth} from '../assets/js/auth.js';
const session=await requireAuth('../index.html');if(!session)throw new Error('auth');
const cid=new URLSearchParams(location.search).get('conversation'),status=document.getElementById('status'),box=document.getElementById('messages'),form=document.getElementById('form');
if(!cid){status.textContent='Selecciona una conversación desde un anuncio para comenzar.';form.hidden=true;}
let channel=null;
function render(m){const p=document.createElement('p');p.dataset.messageId=m.id;p.textContent=(m.sender_id===session.user.id?'Tú: ':'Usuario: ')+m.body;box.appendChild(p);box.scrollTop=box.scrollHeight}
async function load(){if(!cid)return;const q=await supabase.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',cid).order('created_at',{ascending:true});if(q.error){status.textContent='No se pudieron cargar los mensajes.';return}status.textContent='';box.replaceChildren();for(const m of q.data||[])render(m);channel=supabase.channel('conversation-'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},payload=>{if(!box.querySelector('[data-message-id="'+payload.new.id+'"]'))render(payload.new)}).subscribe()}
form.addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('body');const value=b.value.trim();if(!value||!cid)return;const q=await supabase.from('messages').insert({conversation_id:cid,sender_id:session.user.id,body:value});if(q.error){status.textContent='No se pudo enviar el mensaje.';return}b.value=''});
window.addEventListener('beforeunload',()=>{if(channel)supabase.removeChannel(channel)});
load();
</script></body></html>
