name: Quality gate
on:
  push:
    branches: [main, hardening-and-backend]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
      - name: Check Edge Function TypeScript
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          for f in supabase/functions/*/index.ts; do
            deno check "$f"
          done
      - name: Check local HTML links and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('.').resolve()
          files=set(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          bad=[]
          for html in root.rglob('*.html'):
              text=html.read_text(encoding='utf-8')
              for attr,ref in re.findall(r'\b(href|src)\s*=\s*["\']([^"\']+)',text,re.I):
                  if ref.startswith(('#','http:','https:','mailto:','tel:','data:','javascript:')): continue
                  clean=ref.split('#',1)[0].split('?',1)[0]
                  target=(root / clean.lstrip('/')) if clean.startswith('/') else (html.parent / clean)
                  if clean.endswith('/'): target=target/'index.html'
                  try: rel=target.resolve().relative_to(root).as_posix()
                  except ValueError:
                      bad.append(f'{html.relative_to(root)} -> {ref}'); continue
                  if rel not in files: bad.append(f'{html.relative_to(root)} -> {ref}')
          if bad: print('\n'.join(bad)); sys.exit(1)
          print('All local HTML href/src targets resolve.')
          PY
  e2e:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Wait for Netlify deployment
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://zeletas.netlify.app/seguridad/ > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "Netlify did not expose the expected route in time"
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: https://zeletas.netlify.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
