<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accediendo... - Zeletas Hub</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<section class="hero">
  <h2>Completando el acceso...</h2>
  <p id="mensaje">Un momento, estamos verificando tu sesión.</p>
</section>
<script type="module">
import { supabase } from '../assets/js/supabase.js';

const mensaje = document.getElementById('mensaje');

try {
  const { data: { session }, error } = await supabase.auth.getSession();

  if (error) throw error;

  if (session) {
    window.location.replace('/perfil/');
  } else {
    mensaje.textContent = 'No se pudo completar el acceso. Vuelve al inicio e inténtalo de nuevo.';
    setTimeout(() => window.location.replace('/'), 2500);
  }
} catch (error) {
  console.error('Error en callback de autenticación:', error);
  mensaje.textContent = 'No se pudo completar el acceso. Vuelve al inicio e inténtalo de nuevo.';
  setTimeout(() => window.location.replace('/'), 2500);
}
</script>
</body>
</html>
