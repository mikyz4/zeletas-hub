<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accediendo - ZELETAS</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><section class="hero"><h2>Completando el acceso...</h2><p id="mensaje">Verificando sesión y seguridad…</p></section><script type="module">import {supabase} from '../assets/js/supabase.js';import {routeAfterAuth} from '../assets/js/auth.js';const m=document.getElementById('mensaje');try{const {data:{session},error}=await supabase.auth.getSession();if(error)throw error;if(session)await routeAfterAuth('/perfil/');else throw new Error('no-session')}catch(e){console.error(e);m.textContent='No se pudo completar el acceso.';setTimeout(()=>location.replace('/'),2500)}</script></body></html>
